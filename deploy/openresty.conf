# 1Panel website SERVER-BLOCK fragment, not a complete nginx.conf.
# Prerequisite: OpenResty uses the host network on this Linux server.
# Keep 1Panel's listen/server_name/SSL/ACME configuration.
# Replace the generated proxy location / with the one below; do not duplicate it.
# Update an existing client_max_body_size instead of adding a duplicate directive.
client_max_body_size 11m;
access_log off;

location = /internal {
    return 404;
}
location ^~ /internal/ {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite incoming forwarding headers; never trust the visitor's XFF.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_buffering off;
}
