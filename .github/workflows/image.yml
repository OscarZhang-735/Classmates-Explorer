name: Publish backend image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-main
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set image name and SHA tag
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image reference
        id: reference
        env:
          IMAGE_NAME: ${{ steps.names.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$IMAGE_NAME@$DIGEST"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > image-reference.txt
      - name: Pull and test the published digest
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
        run: |
          docker pull "$IMAGE"
          python scripts/check_container.py --image "$IMAGE"
      - name: Save verified image reference
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
          path: image-reference.txt
          if-no-files-found: error
      - name: Release summary
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          {
            echo '## Verified backend image'
            printf '\nTag: `%s`\n\nDigest reference: `%s`\n' "$TAG" "$IMAGE"
            echo ''
            echo 'The production server and Pages have not been updated.'
            echo 'On first publication, set package visibility to public and verify anonymous pull.'
          } >> "$GITHUB_STEP_SUMMARY"
