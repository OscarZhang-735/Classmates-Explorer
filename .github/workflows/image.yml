name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set image name and SHA tag
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image reference
        id: reference
        env:
          IMAGE_NAME: ${{ steps.names.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$IMAGE_NAME@$DIGEST"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > image-reference.txt
      - name: Pull and test the published digest
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
        run: |
          docker pull "$IMAGE"
          python scripts/check_container.py --image "$IMAGE"
      - name: Save verified image reference
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_attempt }}
          path: image-reference.txt
          if-no-files-found: error
      - name: Release summary
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          {
            echo '## Verified backend image'
            printf '\nTag: `%s`\n\nDigest reference: `%s`\n' "$TAG" "$IMAGE"
            echo ''
            echo 'Backend deployment and Pages publishing run in subsequent jobs.'
            echo 'On first publication, set package visibility to public and verify anonymous pull.'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Skip superseded commits
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const current = data.commit.sha === context.sha;
            core.setOutput('current', String(current));
            if (!current) core.notice('Skipping deployment: this commit is no longer the main tip.');
      - uses: actions/checkout@v4
        if: steps.current.outputs.current == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.current.outputs.current == 'true'
        with:
          python-version: '3.12'
      - name: Deploy and verify backend
        id: deploy
        if: steps.current.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PAGES_API_BASE: ${{ vars.PAGES_API_BASE }}
          PAGES_ORIGIN: ${{ vars.PAGES_ORIGIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tempfile
          required = ('DEPLOY_HOST', 'DEPLOY_USER', 'DEPLOY_PATH', 'PAGES_API_BASE',
                      'PAGES_ORIGIN', 'DEPLOY_SSH_KEY', 'DEPLOY_KNOWN_HOSTS', 'IMAGE')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing configuration: ' + ', '.join(missing))
          directory = pathlib.Path(tempfile.mkdtemp(prefix='release-', dir=os.environ['RUNNER_TEMP']))
          directory.chmod(0o700)
          for name, key in [('key', 'DEPLOY_SSH_KEY'), ('known_hosts', 'DEPLOY_KNOWN_HOSTS')]:
              fd = os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'w') as f:
                  f.write(os.environ.pop(key).rstrip() + '\n')
          subprocess.run([
              'python', 'scripts/deploy_ssh.py', '--host', os.environ['DEPLOY_HOST'],
              '--port', os.environ.get('DEPLOY_PORT') or '22', '--user', os.environ['DEPLOY_USER'],
              '--root', os.environ['DEPLOY_PATH'], '--key', str(directory / 'key'),
              '--known-hosts', str(directory / 'known_hosts'), '--image', os.environ['IMAGE'],
              '--api-base', os.environ['PAGES_API_BASE'], '--pages-origin', os.environ['PAGES_ORIGIN'],
          ], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('deployed=true\n')
          PY

  pages:
    needs: backend
    if: needs.backend.outputs.deployed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      api_base: ${{ vars.PAGES_API_BASE }}
